<!doctype html>
<html lang="ml">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0"
    />
    <meta name="theme-color" content="#111111" />
    <meta name="description" content="എഴുത്ത് — offline-first long-form editor for Malayalam and English" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Preloaded rather than left to CSS discovery: the @font-face lives in a
         bundled stylesheet, so without this the font request does not start
         until the CSS has been fetched and parsed. `font-display: block` means
         that delay is time the reader spends looking at nothing.
         crossorigin is required on font preloads even same-origin — omit it
         and the browser fetches the file twice. -->
    <link
      rel="preload"
      href="/fonts/manjari-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iOS ignores the manifest here and requires PNG. Given an SVG it
         screenshots the page instead, which makes the home-screen install
         look broken — and installing is what improves eviction odds on iOS
         (ADR-0013). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>എഴുത്ത് · ezhuthu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
